<!DOCTYPE html>
<html lang="en">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">

    <script src="src/scenes/LobbyScene.js"></script>
    <script src="src/scenes/EquipScene.js"></script>
    <script src="src/scenes/TalentScene.js"></script>
    <script src="src/scenes/ShopScene.js"></script>
    <script src="src/scenes/AbyssScene.js"></script>
    <script src="src/game.js"></script>

</html>
