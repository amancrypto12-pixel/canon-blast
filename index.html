<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Dolphin Pearl — PixiJS Edition</title>
  
  <!-- Telegram SDK -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  
  <!-- PixiJS v7 Engine (High-Performance WebGL 2D) -->
  <script src="https://pixijs.download/v7.3.2/pixi.min.js"></script>
  
  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700;800;900&family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --bg-main: #0D0F17;
      --bg-card: #171A25;
      --bg-card2: #1E2230;
      --stroke: #2A2F40;
      --text-primary: #FFFFFF;
      --text-secondary: #9AA0B4;
      --accent-gold: #FFC933;
      --accent-orange: #FF9F1C;
      --accent-cyan: #00D4FF;
      --fish-green: #6BE35A;
      --star-blue: #5B7CFF;
      --heart-pink: #FF4D8D;
      --danger: #FF3B3B;
      
      --nav-height: 72px;
      --topbar-height: 56px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-tap-highlight-color: transparent; }

    body {
      background: var(--bg-main);
      font-family: 'Inter', sans-serif;
      color: var(--text-primary);
      width: 100vw; height: 100vh;
      overflow: hidden;
      display: flex; flex-direction: column;
    }

    /* WEBEGL CANVAS LAYER */
    #pixi-canvas-container {
      position: absolute;
      top: 0; left: 0;
      width: 100vw; height: 100vh;
      z-index: 1;
      pointer-events: auto;
    }

    /* SEMANTIC UI OVERLAY LAYER */
    .ui-layer {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      z-index: 10;
      pointer-events: none;
      display: flex; flex-direction: column;
    }

    .pointer-auto { pointer-events: auto; }

    /* ================= GLOBAL TOP BAR ================= */
    .app-topbar {
      height: var(--topbar-height);
      display: flex; justify-content: space-between; align-items: center;
      padding: 6px 14px;
      background: rgba(13, 15, 23, 0.95);
      border-bottom: 1px solid rgba(42, 47, 64, 0.5);
      position: relative;
    }
    .topbar-left { display: flex; align-items: center; gap: 8px; }
    .user-profile-badge { display: flex; align-items: center; gap: 6px; }
    .user-avatar-circle {
      width: 26px; height: 26px; border-radius: 50%;
      background: linear-gradient(135deg, #00D4FF, #0284C7);
      display: flex; align-items: center; justify-content: center;
      font-size: 12px; font-weight: 900; color: #fff;
      overflow: hidden; border: 1.5px solid rgba(255, 255, 255, 0.25);
    }
    .user-avatar-circle img { width: 100%; height: 100%; object-fit: cover; }
    .username-label { font-size: 13px; font-weight: 800; }
    .btn-pod-pill {
      background: var(--bg-card2); border: 1px solid var(--stroke); border-radius: 20px;
      padding: 4px 10px; font-family: 'Barlow Condensed', sans-serif; font-size: 12px; font-weight: 800; color: var(--accent-gold);
      display: flex; align-items: center; cursor: pointer;
    }
    .topbar-right { display: flex; align-items: center; gap: 12px; }
    .currency-pill {
      display: flex; align-items: center; gap: 5px;
      font-family: 'Barlow Condensed', sans-serif; font-size: 16px; font-weight: 800;
      cursor: pointer;
    }
    .currency-pill img { width: 22px; height: 22px; object-fit: contain; }

    /* ================= MAIN VIEWPORT ================= */
    .tab-viewport {
      flex: 1; position: relative; width: 100%; overflow: hidden;
    }
    .tab-page {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      pointer-events: none; opacity: 0; transition: opacity 0.2s;
      display: flex; flex-direction: column;
    }
    .tab-page.active { pointer-events: auto; opacity: 1; }

    /* ================= TAB 1: DOLPHINS (HOME) UI ================= */
    .lobby-ui-top {
      padding: 10px 16px;
      display: flex; flex-direction: column; align-items: center; gap: 8px;
    }
    .lobby-header-balance { display: flex; align-items: center; gap: 10px; }
    .dlp-logo { width: 38px; height: 38px; object-fit: contain; filter: drop-shadow(0 0 12px rgba(0,212,255,0.6)); }
    .dlp-counter { font-family: 'Barlow Condensed', sans-serif; font-size: 44px; font-weight: 900; text-shadow: 0 0 16px rgba(0,212,255,0.4); }
    
    .lobby-trio-chips {
      display: grid; grid-template-columns: 1fr auto 1fr; width: 100%; gap: 8px;
    }
    .chip-left { background: var(--bg-card); border: 1px solid var(--stroke); border-radius: 14px; padding: 6px 12px; }
    .chip-center { background: var(--bg-card2); border: 1px solid #363d54; border-radius: 14px; padding: 5px 16px; text-align: center; }
    .chip-right { background: var(--bg-card); border: 1px solid var(--stroke); border-radius: 14px; padding: 6px 12px; text-align: right; }
    
    .card-space-placeholder {
      flex: 1; width: 100%; min-height: 380px; max-height: 460px;
    }

    .lobby-ui-bottom {
      padding: 0 16px 16px; display: flex; flex-direction: column; gap: 8px;
      background: linear-gradient(0deg, rgba(13,15,23,1) 30%, rgba(13,15,23,0) 100%);
    }

    .slot-dots-row { display: flex; align-items: center; justify-content: center; gap: 8px; margin: 4px 0; }
    .slot-dot { width: 14px; height: 14px; border-radius: 50%; background: #2A2F40; transition: 0.2s; }
    .slot-dot.active { background: #FFF; box-shadow: 0 0 10px #FFF; transform: scale(1.25); }
    .slot-dot.owned { background: var(--fish-green); }

    .breed-control-bar { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .btn-breed-pill { background: linear-gradient(135deg, var(--heart-pink), #BE185D); border: none; border-radius: 16px; padding: 12px; color: #FFF; font-family: 'Barlow Condensed'; font-size: 18px; font-weight: 900; width: 100%; cursor: pointer; }
    .btn-stake-pill { background: linear-gradient(135deg, #8B5CF6, #6D28D9); border: none; border-radius: 16px; padding: 12px; color: #FFF; font-family: 'Barlow Condensed'; font-size: 18px; font-weight: 900; width: 100%; cursor: pointer; }

    /* ================= TAB 2: PEARLS (MERGE BOARD) UI ================= */
    .merge-ui-layer { padding: 10px 16px; }
    .merge-stage-banner {
      display: flex; justify-content: space-between; align-items: center; background: var(--bg-card); border: 1px solid var(--stroke); border-radius: 16px; padding: 10px 14px;
    }
    .merge-board-space {
      width: 100%; aspect-ratio: 1; margin: 10px auto; 
    }

    /* ================= BOTTOM NAVIGATION ================= */
    .app-bottom-nav {
      height: var(--nav-height); background: rgba(13, 15, 23, 0.98);
      backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); border-top: 1px solid rgba(42, 47, 64, 0.75);
      display: grid; grid-template-columns: repeat(5, 1fr); z-index: 1000;
    }
    .nav-tab-item {
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; color: var(--text-secondary);
      font-family: 'Barlow Condensed', sans-serif; font-size: 13px; font-weight: 800; transition: color 0.15s; cursor: pointer;
    }
    .nav-tab-item.active { color: var(--accent-gold); }
    .nav-tab-item img { width: 26px; height: 26px; object-fit: contain; opacity: 0.6; }
    .nav-tab-item.active img { opacity: 1; transform: scale(1.15); filter: drop-shadow(0 2px 10px rgba(255, 201, 51, 0.6)); }

    /* ================= TOAST ================= */
    #appToast {
      position: fixed; top: 64px; left: 50%; transform: translateX(-50%); background: rgba(23,26,37,0.95); border: 1px solid var(--accent-cyan);
      color: #fff; padding: 8px 18px; border-radius: 24px; font-size: 12px; font-weight: 800; display: none; z-index: 3000;
    }
  </style>
</head>
<body>

  <!-- PIXIJS CANVAS CONTAINER -->
  <div id="pixi-canvas-container"></div>

  <!-- SEMANTIC HTML UI OVERLAY LAYER -->
  <div class="ui-layer">
    
    <!-- TOP BAR -->
    <div class="app-topbar pointer-auto">
      <div class="topbar-left">
        <div class="user-profile-badge">
          <div class="user-avatar-circle" id="userAvatarWrap"><span id="userAvatarChar">W</span></div>
          <span class="username-label" id="usernameText">Wild_airdrop</span>
        </div>
        <div class="btn-pod-pill">🐬 POD #102</div>
      </div>
      <div class="topbar-right">
        <div class="currency-pill"><img src="assets/icon_user_fish.png" alt="Fish Food"><span id="counterFish">91,339</span></div>
        <div class="currency-pill"><img src="assets/icon_user_star.png" alt="Stars"><span id="counterStars">45</span></div>
      </div>
    </div>

    <!-- VIEWPORT TABS -->
    <div class="tab-viewport">
      
      <!-- TAB 1: DOLPHINS (MAIN MASCOT) -->
      <div id="tab-dolphins" class="tab-page active">
        <div class="lobby-ui-top pointer-auto">
          <!-- DLP Counter -->
          <div class="lobby-header-balance">
            <img src="assets/blue_token_coin.png" class="dlp-logo" alt="DLP">
            <div class="dlp-counter" id="mainDlpCounter">183.49</div>
          </div>
          <!-- Trio Stats -->
          <div class="lobby-trio-chips">
            <div class="chip-left"><div style="font-family:'Barlow Condensed'; font-size:14px; font-weight:800; color:var(--accent-gold);">REEF PASS</div><div style="font-size:10px; color:var(--text-secondary);">DAILY PASS 5 DAYS</div></div>
            <div class="chip-center"><div style="font-family:'Barlow Condensed'; font-size:16px; font-weight:900; color:var(--accent-gold);">LVL 5</div><div style="font-size:10px; font-weight:900; color:#3DDC68;">~ COMMON</div></div>
            <div class="chip-right"><div style="font-family:'Barlow Condensed'; font-size:15px; font-weight:900; color:var(--accent-cyan);">64.9K</div><div style="font-size:10px; color:var(--text-secondary);">/ 2,000</div></div>
          </div>
        </div>
        
        <!-- Empty space so Pixi card rendering is touchable -->
        <div class="card-space-placeholder" id="pixiCardTargetArea"></div>
        
        <div class="lobby-ui-bottom pointer-auto">
          <!-- Slot Dots -->
          <div class="slot-dots-row">
            <div class="slot-dot active"></div><div class="slot-dot owned"></div><div class="slot-dot owned"></div><div class="slot-dot owned"></div><div class="slot-dot"></div>
          </div>
          <!-- Action Buttons -->
          <div class="breed-control-bar">
            <button class="btn-breed-pill" onclick="showToast('Breed Ready (5/5)')">💖 BREED 5/5</button>
            <button class="btn-stake-pill" onclick="showToast('Dolphin Staked into Totem')">⚡ STAKE</button>
          </div>
        </div>
      </div>

      <!-- TAB 2: PEARLS (MERGE BOARD) -->
      <div id="tab-pearls" class="tab-page">
        <div class="merge-ui-layer pointer-auto">
          <div class="merge-stage-banner">
            <div><div style="font-family: 'Barlow Condensed'; font-size: 18px; font-weight: 900; color: var(--heart-pink);">COMBO X1</div><div style="font-size: 11px; color: var(--text-secondary);">Shells Yield: ♪5</div></div>
            <div class="btn-pod-pill" style="border-radius:12px;" onclick="showToast('Auto Merging...')">⚡ AUTO MERGE</div>
          </div>
          
          <div class="merge-board-space" id="pixiMergeTargetArea"></div>
        </div>
      </div>

      <!-- Other tabs -->
      <div id="tab-market" class="tab-page"><h2 style="text-align:center; margin-top:50px;">MARKET (FIFO QUEUE)</h2></div>
      <div id="tab-gods" class="tab-page"><h2 style="text-align:center; margin-top:50px;">OCEAN GODS (TOTEMS)</h2></div>
      <div id="tab-tasks" class="tab-page"><h2 style="text-align:center; margin-top:50px;">TASKS & REWARDS</h2></div>

    </div>

    <!-- BOTTOM NAV -->
    <div class="app-bottom-nav pointer-auto">
      <div class="nav-tab-item" onclick="switchTab('market', this)"><img src="assets/dock_market.png"><span>MARKET</span></div>
      <div class="nav-tab-item" onclick="switchTab('pearls', this)"><img src="assets/pearl_egg_lvl1.png"><span>PEARLS</span></div>
      <div class="nav-tab-item active" onclick="switchTab('dolphins', this)"><img src="assets/dolphin_hero_icon.png"><span>DOLPHINS</span></div>
      <div class="nav-tab-item" onclick="switchTab('gods', this)"><img src="assets/dock_gods.png"><span>GODS</span></div>
      <div class="nav-tab-item" onclick="switchTab('tasks', this)"><img src="assets/dock_tasks.png"><span>TASKS</span></div>
    </div>

  </div>

  <div id="appToast">Notification</div>

  <!-- =========================================
       PIXIJS GAME ENGINE LOGIC
       ========================================= -->
  <script>
    const state = {
      dlp: 183.49, fish: 91339, stars: 45,
      activeTab: 'dolphins',
      feedCount: 0,
      grid: Array(49).fill(0)
    };
    
    function showToast(msg) {
      const t = document.getElementById('appToast');
      t.innerText = msg; t.style.display = 'block';
      clearTimeout(window.toastTimer);
      window.toastTimer = setTimeout(() => { t.style.display = 'none'; }, 2000);
    }

    function switchTab(id, el) {
      state.activeTab = id;
      document.querySelectorAll('.tab-page').forEach(p => p.classList.remove('active'));
      document.querySelectorAll('.nav-tab-item').forEach(b => b.classList.remove('active'));
      document.getElementById('tab-' + id).classList.add('active');
      el.classList.add('active');
      
      if (app && app.stage) {
        heroGroup.visible = (id === 'dolphins');
        mergeGroup.visible = (id === 'pearls');
      }

      if(window.Telegram?.WebApp?.HapticFeedback) {
        window.Telegram.WebApp.HapticFeedback.impactOccurred('light');
      }
    }

    // --- PIXI JS SETUP ---
    const app = new PIXI.Application({
      width: window.innerWidth,
      height: window.innerHeight,
      resizeTo: window,
      backgroundColor: 0x0D0F17,
      resolution: window.devicePixelRatio || 1,
      autoDensity: true,
      antialias: true
    });
    document.getElementById('pixi-canvas-container').appendChild(app.view);

    // Containers (Layers)
    const ambientGroup = new PIXI.Container();
    const heroGroup = new PIXI.Container();
    const mergeGroup = new PIXI.Container();
    const fxGroup = new PIXI.Container();
    
    app.stage.addChild(ambientGroup);
    app.stage.addChild(heroGroup);
    app.stage.addChild(mergeGroup);
    app.stage.addChild(fxGroup);
    
    mergeGroup.visible = false;

    // 1. Ambient Background Particles
    const particles = [];
    for(let i=0; i<30; i++){
      const p = new PIXI.Graphics();
      p.beginFill(0x00D4FF, Math.random()*0.4 + 0.1);
      p.drawCircle(0, 0, Math.random()*2 + 1);
      p.endFill();
      p.x = Math.random() * app.screen.width;
      p.y = Math.random() * app.screen.height;
      p.vx = (Math.random()-0.5) * 0.3;
      p.vy = -Math.random() * 0.4 - 0.2;
      ambientGroup.addChild(p);
      particles.push(p);
    }
    
    // 2. Load Assets
    PIXI.Assets.addBundle('game', {
      dolphin: 'assets/dolphin_hero_stage.png',
      fishFood: 'assets/icon_user_fish.png',
      coin: 'assets/blue_token_coin.png',
      pearl1: 'assets/pearl_egg_lvl1.png',
      pearl2: 'assets/pearl_egg_lvl2.png',
      pearl3: 'assets/pearl_egg_lvl3.png'
    });

    PIXI.Assets.loadBundle('game').then(textures => {
      buildHeroCard(textures);
      buildMergeBoard(textures);
      
      app.ticker.add((delta) => {
        gameLoop(delta);
      });

      if (window.Telegram?.WebApp) {
        window.Telegram.WebApp.ready();
        window.Telegram.WebApp.expand();
      }
    });

    // --- HERO STAGE (DOLPHIN MAIN CHARACTER) ---
    let dolphinSprite, dlpTween = 0;
    
    function buildHeroCard(textures) {
      const targetRect = document.getElementById('pixiCardTargetArea').getBoundingClientRect();
      const cardHeight = Math.min(380, targetRect.height - 20);
      const cardWidth = Math.min(380, targetRect.width - 40);
      const cx = targetRect.left + (targetRect.width / 2);
      const cy = targetRect.top + (targetRect.height / 2);
      
      heroGroup.x = cx;
      heroGroup.y = cy;

      // Card BG
      const cardBg = new PIXI.Graphics();
      cardBg.beginFill(0x1B1E2B, 1);
      cardBg.lineStyle(2, 0x2A2F40, 1);
      cardBg.drawRoundedRect(-cardWidth/2, -cardHeight/2, cardWidth, cardHeight, 28);
      cardBg.endFill();
      cardBg.eventMode = 'static';
      cardBg.cursor = 'pointer';
      heroGroup.addChild(cardBg);

      // Glow behind dolphin
      const glow = new PIXI.Graphics();
      glow.beginFill(0x00D4FF, 0.2);
      glow.drawCircle(0, -10, 120);
      glow.endFill();
      glow.filters = [new PIXI.filters.BlurFilter(30)];
      heroGroup.addChild(glow);

      // Main Mascot: Dolphin Character Sprite
      dolphinSprite = new PIXI.Sprite(textures.dolphin);
      dolphinSprite.anchor.set(0.5);
      dolphinSprite.scale.set(0.20); // Scaled for high-res dolphin sprite
      dolphinSprite.position.set(0, -15);
      heroGroup.addChild(dolphinSprite);

      // Tap to Feed Action
      cardBg.on('pointerdown', (e) => {
        if (state.fish < 150) { showToast('Need 150 🐟 Fish to feed Dolphin!'); return; }
        state.fish -= 150;
        state.dlp += 0.02;
        document.getElementById('counterFish').innerText = state.fish.toLocaleString();
        document.getElementById('mainDlpCounter').innerText = state.dlp.toFixed(2);
        
        // Squash & Stretch
        dlpTween = 1.0;
        
        if(window.Telegram?.WebApp?.HapticFeedback) {
          window.Telegram.WebApp.HapticFeedback.impactOccurred('light');
        }

        // Spawn Floating Text Particles in Pixi
        spawnFloatingText(e.global.x, e.global.y - 30, '+0.02 DLP', 0x6BE35A);
        spawnFloatingText(e.global.x, e.global.y + 10, '-150 🐟', 0xFF9F1C);
      });
      
      // Feed Tag (White Tilted Tag)
      const tagBg = new PIXI.Graphics();
      tagBg.beginFill(0xFFFFFF);
      tagBg.lineStyle(2, 0xE2E8F0);
      tagBg.drawRoundedRect(-140, cardHeight/2 - 50, 280, 60, 16);
      tagBg.endFill();
      tagBg.rotation = -0.02;
      heroGroup.addChild(tagBg);
      
      const txtConfig = new PIXI.TextStyle({ fontFamily: 'Arial', fontWeight: '900', fontSize: 19, fill: '#0D0F17' });
      const tagTxt = new PIXI.Text('TAP TO FEED  🐟 150', txtConfig);
      tagTxt.anchor.set(0.5);
      tagTxt.position.set(0, cardHeight/2 - 28);
      tagTxt.rotation = -0.02;
      heroGroup.addChild(tagTxt);
    }

    // --- MERGE BOARD (PEARLS) ---
    const CELL_SIZE = 48;
    function buildMergeBoard(textures) {
      const gRect = document.getElementById('pixiMergeTargetArea').getBoundingClientRect();
      const cx = gRect.left + (gRect.width / 2);
      const cy = gRect.top + (gRect.height / 2);
      mergeGroup.x = cx; mergeGroup.y = cy;

      const boardBg = new PIXI.Graphics();
      boardBg.beginFill(0x1E2230);
      boardBg.drawRoundedRect(-180, -180, 360, 360, 20);
      boardBg.endFill();
      mergeGroup.addChild(boardBg);
      
      const grid = new PIXI.Container();
      grid.x = -163; grid.y = -163;
      mergeGroup.addChild(grid);

      const lockedCorners = [0, 6, 42, 48];
      
      for(let i = 0; i < 49; i++) {
        const _row = Math.floor(i / 7);
        const _col = i % 7;
        
        const cell = new PIXI.Graphics();
        
        if (lockedCorners.includes(i)) {
          cell.beginFill(0x090B10);
          cell.drawRoundedRect(0, 0, 44, 44, 8);
        } else {
          cell.beginFill(0x141722);
          cell.drawRoundedRect(0, 0, 44, 44, 8);
          
          cell.eventMode = 'static';
          cell.cursor = 'pointer';
          cell.on('pointerdown', (e) => {
            handleMergeTap(i, cell, textures, e.global);
          });
        }
        
        cell.x = _col * CELL_SIZE;
        cell.y = _row * CELL_SIZE;
        grid.addChild(cell);
      }
    }

    const gridSprites = {};
    function handleMergeTap(i, cellGroup, textures, globalPos) {
      if (state.grid[i] === 0) {
        state.grid[i] = 1;
        const sp = new PIXI.Sprite(textures.pearl1);
        sp.anchor.set(0.5);
        sp.x = 22; sp.y = 22; sp.scale.set(0.85);
        cellGroup.addChild(sp);
        gridSprites[i] = sp;
        if(window.Telegram?.WebApp?.HapticFeedback) window.Telegram.WebApp.HapticFeedback.impactOccurred('light');
        spawnFloatingText(globalPos.x, globalPos.y, 'Pearl Placed!', 0x22C55E);
      } else {
        state.grid[i] = Math.min(state.grid[i] + 1, 3);
        const tex = textures['pearl' + state.grid[i]];
        if (tex) gridSprites[i].texture = tex;
        if(window.Telegram?.WebApp?.HapticFeedback) window.Telegram.WebApp.HapticFeedback.impactOccurred('medium');
        spawnFloatingText(globalPos.x, globalPos.y, 'Merged Tier ' + state.grid[i], 0xFFC933);
        
        gridSprites[i].scale.set(1.2);
      }
    }

    // --- GAME LOOP & PARTICLES ---
    const texts = [];
    function spawnFloatingText(x, y, msg, color) {
      const s = new PIXI.TextStyle({ fontFamily: 'Arial', fontWeight: '900', fontSize: 24, fill: color, dropShadow: true, dropShadowDistance: 2, dropShadowAlpha: 0.8 });
      const t = new PIXI.Text(msg, s);
      t.anchor.set(0.5); t.x = x; t.y = y;
      t.vy = -3 - Math.random()*2;
      t.alpha = 1;
      fxGroup.addChild(t);
      texts.push(t);
    }

    let time = 0;
    function gameLoop(delta) {
      time += delta * 0.05;

      // Ambient Particles
      particles.forEach(p => {
        p.x += p.vx * delta; p.y += p.vy * delta;
        if(p.y < 0) { p.y = app.screen.height; p.x = Math.random() * app.screen.width; }
      });

      // Hero Dolphin Mascot Idle Breathing & Squash/Stretch
      if (dolphinSprite) {
        const baseScale = 0.20;
        if (dlpTween > 0) {
          dlpTween -= 0.1 * delta;
          dolphinSprite.scale.set(baseScale - dlpTween*0.02, baseScale + dlpTween*0.04);
        } else {
          dolphinSprite.scale.set(baseScale, baseScale + Math.sin(time)*0.005);
          dolphinSprite.y = -15 + Math.sin(time)*4;
        }
      }

      // Merge Sprites scale decay
      for(let key in gridSprites) {
        const sp = gridSprites[key];
        if (sp.scale.x > 0.85) {
          sp.scale.set(sp.scale.x - 0.04 * delta);
        }
      }

      // Floating Texts
      for(let i = texts.length - 1; i >= 0; i--) {
        const t = texts[i];
        t.y += t.vy * delta;
        t.alpha -= 0.02 * delta;
        if(t.alpha <= 0) { fxGroup.removeChild(t); texts.splice(i, 1); }
      }
    }
  </script>
</body>
</html>
