<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Cannon Blast - Telegram Mini App</title>
    <!-- Telegram WebApp SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <!-- TON Connect SDK -->
    <script src="https://unpkg.com/@tonconnect/ui@latest/dist/tonconnect-ui.min.js"></script>
    
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div id="app-container">
        <!-- Main Game View -->
        <div id="game-view" class="view active">
            <canvas id="gameCanvas"></canvas>
            
            <!-- HUD -->
            <div id="hud">
                <div class="hud-top">
                    <div class="hud-left">
                        <div class="level-pill glass-panel">
                            <span class="lvl-label">Lvl</span> <span id="level-value">1</span>
                            <div class="wave-progress-bg"><div id="wave-progress-fill"></div></div>
                        </div>
                    </div>
                    <div class="hud-right">
                        <div class="currency-pill glass-panel">
                            <img id="hud-coin-img" class="currency-icon" src="" alt="C"> <span id="coin-value">0</span>
                        </div>
                        <div class="currency-pill glass-panel">
                            <img id="hud-gem-img" class="currency-icon" src="" alt="G"> <span id="gem-value">0</span>
                        </div>
                        <button id="pause-btn" class="glass-btn">
                            <img id="hud-pause-img" src="" alt="P" style="width:20px;height:20px;">
                        </button>
                    </div>
                </div>
                
                <!-- Ultimate Bar -->
                <div class="ultimate-container glass-panel">
                    <div class="ult-progress-bg"><div id="ult-progress-fill"></div></div>
                    <button id="ult-btn" class="ult-btn disabled">ULTIMATE</button>
                </div>
                
                <!-- Navigation -->
                <div class="bottom-nav glass-panel">
                    <button id="nav-shop" class="nav-btn">Shop</button>
                    <button id="nav-wallet" class="nav-btn">Wallet</button>
                </div>
            </div>
            
            <!-- Game Over Screen -->
            <div id="game-over-screen" class="overlay glass-panel hidden">
                <h1>Game Over</h1>
                <p>Wave Failed</p>
                <button id="retry-btn" class="primary-btn">Retry</button>
            </div>
        </div>

        <!-- Shop View -->
        <div id="shop-view" class="view hidden glass-panel-bg">
            <div class="view-header">
                <h2>Shop</h2>
                <button class="nav-back glass-btn">✕</button>
            </div>
            <div class="shop-tabs">
                <button class="shop-tab active" data-cat="abilities">Abilities</button>
                <button class="shop-tab" data-cat="weapons">Weapons</button>
                <button class="shop-tab" data-cat="ultimates">Ultimates</button>
                <button class="shop-tab" data-cat="drones">Drones</button>
            </div>
            <div id="shop-grid" class="shop-grid">
                <!-- Populated by shop.js -->
            </div>
        </div>

        <!-- Wallet View -->
        <div id="wallet-view" class="view hidden glass-panel-bg">
            <div class="view-header">
                <h2>Wallet (TON)</h2>
                <button class="nav-back glass-btn">✕</button>
            </div>
            <div class="wallet-content">
                <p>Connect your TON wallet to claim rewards.</p>
                <div id="ton-connect"></div>
                <div id="wallet-actions" class="hidden">
                    <p>Connected: <span id="wallet-address"></span></p>
                    <button id="claim-btn" class="primary-btn">Claim Rewards</button>
                </div>
            </div>
        </div>

    </div>

    <!-- Logic -->
    <script src="shop.js"></script>
    <script src="game.js"></script>
</body>
</html>
