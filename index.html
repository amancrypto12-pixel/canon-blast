<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>Clockwork Dungeon</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{background:#0a0a1a;overflow:hidden;touch-action:none;}
canvas{display:block;margin:0 auto;}
</style>
<script src="//cdn.jsdelivr.net/npm/phaser@3.88.2/dist/phaser.min.js"></script>
</head>
<body>
<script>
// ===== CLOCKWORK DUNGEON - Phaser 3 Mobile Roguelite =====

const config = {
    type: Phaser.AUTO,
    width: 800,
    height: 600,
    parent: document.body,
    backgroundColor: '#0d0d1a',
    scale: {
        mode: Phaser.Scale.FIT,
        autoCenter: Phaser.Scale.CENTER_BOTH
    },
    physics: {
        default: 'arcade',
        arcade: { debug: false }
    },
    scene: [BootScene, GameScene, UpgradeScene, GameOverScene]
};

const GAME_DATA = {
    wave: 1, score: 0, kills: 0, level: 1, xp: 0,
    skills: [], playerHp: 100, playerMaxHp: 100,
    playerDamage: 20, playerSpeed: 200, fireRate: 300
};

function resetGameData() {
    GAME_DATA.wave = 1; GAME_DATA.score = 0; GAME_DATA.kills = 0;
    GAME_DATA.level = 1; GAME_DATA.xp = 0; GAME_DATA.skills = [];
    GAME_DATA.playerHp = 100; GAME_DATA.playerMaxHp = 100;
    GAME_DATA.playerDamage = 20; GAME_DATA.playerSpeed = 200;
    GAME_DATA.fireRate = 300;
}

// ===== BOOT SCENE - Generate textures =====
class BootScene extends Phaser.Scene {
    constructor() { super('Boot'); }
    create() {
        // Generate Spider texture
        const sg = this.make.graphics({x:0,y:0,add:false});
        sg.fillStyle(0xA07820);
        sg.fillEllipse(24,20,48,40);
        sg.fillStyle(0xD4A830);
        sg.fillEllipse(24,18,40,32);
        // Eyes
        sg.fillStyle(0x00FFFF);
        sg.fillCircle(16,22,6); sg.fillCircle(32,22,6);
        sg.fillStyle(0xFFFFFF);
        sg.fillCircle(16,22,3); sg.fillCircle(32,22,3);
        // Legs
        sg.lineStyle(3,0x8B6914);
        for(let i=0;i<3;i++){
            sg.lineBetween(6,20+i*5,0-8,35+i*6);
            sg.lineBetween(42,20+i*5,48+8,35+i*6);
        }
        // Rivets
        sg.fillStyle(0xC8A832);
        sg.fillCircle(10,10,2); sg.fillCircle(38,10,2);
        sg.fillCircle(24,6,2);
        sg.generateTexture('spider',48,44);
        sg.destroy();

        // Generate Demon texture
        const dg = this.make.graphics({x:0,y:0,add:false});
        // Wings
        dg.fillStyle(0xFF4400);
        dg.fillTriangle(10,25,0,5,20,15);
        dg.fillTriangle(54,25,64,5,44,15);
        dg.fillStyle(0xFF6600);
        dg.fillTriangle(8,20,2,2,18,12);
        dg.fillTriangle(56,20,62,2,46,12);
        // Body
        dg.fillStyle(0x440808);
        dg.fillEllipse(32,35,36,44);
        dg.fillStyle(0x661111);
        dg.fillEllipse(32,32,28,36);
        // Head
        dg.fillStyle(0x881111);
        dg.fillCircle(32,14,12);
        // Horns
        dg.fillStyle(0x331111);
        dg.fillTriangle(24,8,20,0,26,4);
        dg.fillTriangle(40,8,44,0,38,4);
        // Hair/flame
        dg.fillStyle(0xCC2200);
        dg.fillTriangle(24,6,32,0,40,6);
        // Eyes
        dg.fillStyle(0xFFAA00);
        dg.fillCircle(28,14,3); dg.fillCircle(36,14,3);
        // Grin
        dg.lineStyle(2,0xFF4400);
        dg.beginPath(); dg.arc(32,18,5,0.2,Math.PI-0.2); dg.strokePath();
        // Sword
        dg.fillStyle(0xFFD700);
        dg.fillRect(46,25,3,22);
        dg.fillStyle(0xAA8800);
        dg.fillRect(43,45,9,3);
        dg.fillStyle(0xFF6600);
        dg.fillTriangle(45,25,50,25,47.5,18);
        // Gold trim
        dg.lineStyle(1,0xFFD700);
        dg.strokeEllipse(32,30,24,16);
        dg.generateTexture('demon',64,58);
        dg.destroy();

        // Bullet
        const bg = this.make.graphics({x:0,y:0,add:false});
        bg.fillStyle(0xFFDD00); bg.fillCircle(5,5,5);
        bg.fillStyle(0xFFFFFF); bg.fillCircle(5,5,2);
        bg.generateTexture('bullet',10,10); bg.destroy();

        // Enemy bullet
        const eb = this.make.graphics({x:0,y:0,add:false});
        eb.fillStyle(0xFF4400); eb.fillCircle(6,6,6);
        eb.fillStyle(0xFF8800); eb.fillCircle(6,6,3);
        eb.generateTexture('enemyBullet',12,12); eb.destroy();

        // XP orb
        const xg = this.make.graphics({x:0,y:0,add:false});
        xg.fillStyle(0x44FF88); xg.fillCircle(6,6,6);
        xg.fillStyle(0xAAFFCC); xg.fillCircle(6,6,3);
        xg.generateTexture('xpOrb',12,12); xg.destroy();

        // Player
        const pg = this.make.graphics({x:0,y:0,add:false});
        pg.fillStyle(0x2266FF); pg.fillCircle(16,16,16);
        pg.fillStyle(0x88BBFF); pg.fillCircle(16,16,8);
        pg.fillStyle(0xAACCFF); pg.fillRect(24,13,14,6);
        pg.fillStyle(0xFFFFFF); pg.fillCircle(24,16,4);
        pg.generateTexture('player',40,32); pg.destroy();

        // Joystick base & knob
        const jb = this.make.graphics({x:0,y:0,add:false});
        jb.fillStyle(0xFFFFFF,0.2); jb.fillCircle(60,60,60);
        jb.lineStyle(2,0xFFFFFF,0.4); jb.strokeCircle(60,60,60);
        jb.generateTexture('joyBase',120,120); jb.destroy();
        const jk = this.make.graphics({x:0,y:0,add:false});
        jk.fillStyle(0x4488FF,0.7); jk.fillCircle(25,25,25);
        jk.generateTexture('joyKnob',50,50); jk.destroy();

        // Fire button
        const fb = this.make.graphics({x:0,y:0,add:false});
        fb.fillStyle(0xFF4400,0.5); fb.fillCircle(35,35,35);
        fb.lineStyle(3,0xFF6600,0.8); fb.strokeCircle(35,35,35);
        fb.fillStyle(0xFFAA00,0.8); fb.fillCircle(35,35,15);
        fb.generateTexture('fireBtn',70,70); fb.destroy();

        this.scene.start('Game');
    }
}

// ===== GAME SCENE =====
class GameScene extends Phaser.Scene {
    constructor() { super('Game'); }

    create() {
        this.cameras.main.setBackgroundColor('#0d0d1a');
        // Grid background
        const grid = this.add.graphics();
        grid.lineStyle(1, 0xff6600, 0.04);
        for(let x=0;x<800;x+=40){grid.lineBetween(x,0,x,600);}
        for(let y=0;y<600;y+=40){grid.lineBetween(0,y,800,y);}

        // Groups
        this.bullets = this.physics.add.group({defaultKey:'bullet',maxSize:100});
        this.enemyBullets = this.physics.add.group({defaultKey:'enemyBullet',maxSize:50});
        this.enemies = this.physics.add.group();
        this.xpOrbs = this.physics.add.group({defaultKey:'xpOrb'});

        // Player
        this.player = this.physics.add.sprite(400,300,'player');
        this.player.setCollideWorldBounds(true);
        this.player.setDepth(10);

        // State
        this.lastShot = 0;
        this.waveEnemiesSpawned = 0;
        this.waveEnemiesNeeded = 5;
        this.spawnTimer = 0;
        this.invulnTime = 0;
        this.bossActive = false;
        this.waveComplete = false;
        this.waveDelay = 0;

        // Collisions
        this.physics.add.overlap(this.bullets,this.enemies,this.bulletHitEnemy,null,this);
        this.physics.add.overlap(this.player,this.enemies,this.enemyHitPlayer,null,this);
        this.physics.add.overlap(this.player,this.enemyBullets,this.eBulletHitPlayer,null,this);
        this.physics.add.overlap(this.player,this.xpOrbs,this.collectXp,null,this);

        // HUD
        this.createHUD();

        // Controls - Mobile Joystick + Fire button
        this.createMobileControls();

        // Keyboard fallback
        this.cursors = this.input.keyboard.addKeys({
            up:'W',down:'S',left:'A',right:'D',
            space:'SPACE'
        });
        this.input.keyboard.on('keydown-ONE',()=>{if(this.scene.isActive('Upgrade'))return;});
    }

    createHUD() {
        this.hpBar = this.add.graphics().setDepth(100).setScrollFactor(0);
        this.xpBar = this.add.graphics().setDepth(100).setScrollFactor(0);
        this.waveText = this.add.text(400,12,'Wave 1',{
            fontSize:'16px',fontFamily:'monospace',color:'#ffcc00',stroke:'#000',strokeThickness:3
        }).setOrigin(0.5,0).setDepth(100);
        this.scoreText = this.add.text(790,12,'0',{
            fontSize:'14px',fontFamily:'monospace',color:'#fff',stroke:'#000',strokeThickness:2
        }).setOrigin(1,0).setDepth(100);
        this.levelText = this.add.text(10,38,'LVL 1',{
            fontSize:'12px',fontFamily:'monospace',color:'#aa66ff',stroke:'#000',strokeThickness:2
        }).setDepth(100);
        this.bossBar = this.add.graphics().setDepth(100).setVisible(false);
        this.bossText = this.add.text(400,565,'',{
            fontSize:'12px',fontFamily:'monospace',color:'#fff',stroke:'#000',strokeThickness:2
        }).setOrigin(0.5).setDepth(100).setVisible(false);
    }

    createMobileControls() {
        // Joystick (left side)
        this.joyBase = this.add.image(100,500,'joyBase').setDepth(200).setScrollFactor(0).setAlpha(0);
        this.joyKnob = this.add.image(100,500,'joyKnob').setDepth(201).setScrollFactor(0).setAlpha(0);
        this.joyData = {active:false,startX:0,startY:0,forceX:0,forceY:0,pointer:null};

        // Fire button (right side)
        this.fireBtn = this.add.image(700,500,'fireBtn').setDepth(200).setScrollFactor(0)
            .setInteractive().setAlpha(0.6);
        this.fireHeld = false;

        // Touch input for joystick (left half of screen)
        this.input.on('pointerdown',(pointer)=>{
            if(pointer.x < 400 && !this.joyData.active){
                this.joyData.active = true;
                this.joyData.pointer = pointer;
                this.joyData.startX = pointer.x;
                this.joyData.startY = pointer.y;
                this.joyBase.setPosition(pointer.x,pointer.y).setAlpha(1);
                this.joyKnob.setPosition(pointer.x,pointer.y).setAlpha(1);
            }
            if(pointer.x >= 400){
                this.fireHeld = true;
                this.aimAngle = Phaser.Math.Angle.Between(
                    this.player.x,this.player.y,
                    pointer.worldX,pointer.worldY
                );
            }
        });

        this.input.on('pointermove',(pointer)=>{
            if(this.joyData.active && this.joyData.pointer === pointer){
                let dx = pointer.x - this.joyData.startX;
                let dy = pointer.y - this.joyData.startY;
                const dist = Math.sqrt(dx*dx+dy*dy);
                const maxDist = 50;
                if(dist > maxDist){dx=(dx/dist)*maxDist;dy=(dy/dist)*maxDist;}
                this.joyKnob.setPosition(this.joyData.startX+dx,this.joyData.startY+dy);
                this.joyData.forceX = dx/maxDist;
                this.joyData.forceY = dy/maxDist;
            }
            if(pointer.x >= 400 && this.fireHeld){
                this.aimAngle = Phaser.Math.Angle.Between(
                    this.player.x,this.player.y,
                    pointer.worldX,pointer.worldY
                );
            }
        });

        this.input.on('pointerup',(pointer)=>{
            if(this.joyData.pointer === pointer){
                this.joyData.active = false;
                this.joyData.forceX = 0;
                this.joyData.forceY = 0;
                this.joyData.pointer = null;
                this.joyBase.setAlpha(0);
                this.joyKnob.setAlpha(0);
            }
            if(pointer.x >= 400){
                this.fireHeld = false;
            }
        });

        this.aimAngle = 0;
    }

    update(time, delta) {
        if(!this.player.active) return;

        // Movement
        let vx=0,vy=0;
        if(this.cursors.left.isDown) vx=-1;
        if(this.cursors.right.isDown) vx=1;
        if(this.cursors.up.isDown) vy=-1;
        if(this.cursors.down.isDown) vy=1;
        // Joystick overrides
        if(this.joyData.active){
            vx = this.joyData.forceX;
            vy = this.joyData.forceY;
        }
        const speed = GAME_DATA.playerSpeed;
        if(vx!==0||vy!==0){
            const len=Math.sqrt(vx*vx+vy*vy);
            this.player.setVelocity((vx/len)*speed,(vy/len)*speed);
        } else {
            this.player.setVelocity(0,0);
        }

        // Aim (mouse for desktop)
        if(!this.joyData.active && this.input.activePointer.isDown && this.input.activePointer.x>=400){
            this.aimAngle = Phaser.Math.Angle.Between(
                this.player.x,this.player.y,
                this.input.activePointer.worldX,this.input.activePointer.worldY
            );
        } else if(!this.sys.game.device.input.touch){
            this.aimAngle = Phaser.Math.Angle.Between(
                this.player.x,this.player.y,
                this.input.activePointer.worldX,this.input.activePointer.worldY
            );
        }
        this.player.setRotation(this.aimAngle);

        // Auto-fire when touching right or mouse down
        if(this.fireHeld || (!this.sys.game.device.input.touch && this.input.activePointer.isDown)){
            this.shoot(time);
        }

        // Invulnerability
        if(this.invulnTime > 0){
            this.invulnTime -= delta;
            this.player.setAlpha(0.5+Math.sin(time*0.02)*0.3);
        } else { this.player.setAlpha(1); }

        // Regen
        if(GAME_DATA.skills.includes('regen')){
            GAME_DATA.playerHp = Math.min(GAME_DATA.playerMaxHp, GAME_DATA.playerHp+0.01*delta/16);
        }

        // Spawn enemies
        if(!this.waveComplete && !this.bossActive){
            this.spawnTimer += delta;
            const rate = Math.max(400,1200-GAME_DATA.wave*80);
            if(this.spawnTimer >= rate && this.waveEnemiesSpawned < this.waveEnemiesNeeded){
                this.spawnTimer=0;
                this.spawnEnemy();
            }
            if(this.waveEnemiesSpawned>=this.waveEnemiesNeeded && this.enemies.countActive()===0){
                this.waveComplete=true; this.waveDelay=0;
                this.showWaveBanner();
            }
        }
        if(this.waveComplete){
            this.waveDelay += delta;
            if(this.waveDelay >= 2000) this.nextWave();
        }

        // XP magnet
        const magRange = GAME_DATA.skills.includes('magnet') ? 150 : 70;
        this.xpOrbs.getChildren().forEach(orb=>{
            if(!orb.active) return;
            const d = Phaser.Math.Distance.Between(this.player.x,this.player.y,orb.x,orb.y);
            if(d < magRange){
                this.physics.moveToObject(orb, this.player, 250);
            }
        });

        // Boss attack
        this.enemies.getChildren().forEach(e=>{
            if(!e.active||e.getData('type')!=='boss') return;
            const t = e.getData('atkTimer')+(delta);
            e.setData('atkTimer',t);
            if(t >= 2000){
                e.setData('atkTimer',0);
                this.bossAttack(e);
            }
        });

        // Update HUD
        this.updateHUD();

        // Victory
        if(GAME_DATA.wave > 20 && this.enemies.countActive()===0 && !this.bossActive){
            this.scene.start('GameOver',{victory:true});
        }
    }

    shoot(time) {
        if(time - this.lastShot < GAME_DATA.fireRate) return;
        this.lastShot = time;
        const angles = [this.aimAngle];
        if(GAME_DATA.skills.includes('multishot')){
            angles.push(this.aimAngle-0.15);
            angles.push(this.aimAngle+0.15);
        }
        angles.forEach(a=>{
            const b = this.bullets.get(this.player.x+Math.cos(a)*20,this.player.y+Math.sin(a)*20);
            if(!b)return;
            b.setActive(true).setVisible(true).setRotation(a);
            b.body.enable = true;
            const spd = 500;
            b.setVelocity(Math.cos(a)*spd,Math.sin(a)*spd);
            let dmg = GAME_DATA.playerDamage;
            if(GAME_DATA.skills.includes('crit')&&Math.random()<0.25) dmg*=2;
            b.setData('damage',dmg);
            b.setData('pierce',GAME_DATA.skills.includes('piercing')?3:1);
            this.time.delayedCall(1500,()=>{if(b.active){b.setActive(false).setVisible(false);b.body.enable=false;}});
        });
    }

    spawnEnemy() {
        let x,y;
        const side = Phaser.Math.Between(0,3);
        switch(side){
            case 0:x=-30;y=Phaser.Math.Between(0,600);break;
            case 1:x=830;y=Phaser.Math.Between(0,600);break;
            case 2:x=Phaser.Math.Between(0,800);y=-30;break;
            case 3:x=Phaser.Math.Between(0,800);y=630;break;
        }
        const e = this.enemies.create(x,y,'spider');
        e.setData('type','spider');
        e.setData('hp',40+GAME_DATA.wave*10);
        e.setData('maxHp',40+GAME_DATA.wave*10);
        e.setData('damage',10+GAME_DATA.wave*2);
        e.setData('speed',100+Math.random()*30+GAME_DATA.wave*8);
        e.setData('xpVal',10);
        e.setScale(1.2);
        this.waveEnemiesSpawned++;
    }

    spawnBoss() {
        const e = this.enemies.create(400,-60,'demon');
        e.setData('type','boss');
        e.setData('hp',500+GAME_DATA.wave*100);
        e.setData('maxHp',500+GAME_DATA.wave*100);
        e.setData('damage',25+GAME_DATA.wave*5);
        e.setData('speed',80);
        e.setData('xpVal',100);
        e.setData('atkTimer',0);
        e.setScale(1.8);
        this.bossActive = true;
        this.bossBar.setVisible(true);
        this.bossText.setVisible(true);
    }

    bossAttack(boss) {
        for(let i=0;i<8;i++){
            const a = (Math.PI*2/8)*i;
            const b = this.enemyBullets.get(boss.x,boss.y);
            if(!b) continue;
            b.setActive(true).setVisible(true);
            b.body.enable = true;
            b.setVelocity(Math.cos(a)*200,Math.sin(a)*200);
            b.setData('damage',boss.getData('damage'));
            this.time.delayedCall(3000,()=>{if(b.active){b.setActive(false).setVisible(false);b.body.enable=false;}});
        }
    }

    bulletHitEnemy(bullet,enemy) {
        if(!bullet.active||!enemy.active) return;
        let hp = enemy.getData('hp') - bullet.getData('damage');
        enemy.setData('hp',hp);
        // Hit flash
        enemy.setTint(0xffffff);
        this.time.delayedCall(80,()=>{if(enemy.active)enemy.clearTint();});
        // Damage number
        const dt = this.add.text(enemy.x,enemy.y-30,Math.round(bullet.getData('damage')),{
            fontSize:'14px',fontFamily:'monospace',color:'#ff4444',stroke:'#000',strokeThickness:2
        }).setOrigin(0.5).setDepth(50);
        this.tweens.add({targets:dt,y:dt.y-30,alpha:0,duration:600,onComplete:()=>dt.destroy()});
        // Explosion skill
        if(GAME_DATA.skills.includes('explosion')){
            this.enemies.getChildren().forEach(ne=>{
                if(!ne.active||ne===enemy)return;
                if(Phaser.Math.Distance.Between(bullet.x,bullet.y,ne.x,ne.y)<60){
                    ne.setData('hp',ne.getData('hp')-bullet.getData('damage')*0.5);
                    if(ne.getData('hp')<=0) this.killEnemy(ne);
                }
            });
        }
        // Pierce
        let pierce = bullet.getData('pierce')-1;
        bullet.setData('pierce',pierce);
        if(pierce<=0){bullet.setActive(false).setVisible(false);bullet.body.enable=false;}

        if(hp<=0) this.killEnemy(enemy);
    }

    killEnemy(enemy) {
        const type = enemy.getData('type');
        GAME_DATA.score += type==='boss'?500:50;
        GAME_DATA.kills++;
        // XP orb
        const orb = this.xpOrbs.get(enemy.x,enemy.y);
        if(orb){orb.setActive(true).setVisible(true);orb.body.enable=true;
            orb.setData('value',enemy.getData('xpVal'));
            orb.setScale(type==='boss'?2:1);
        }
        // Vampiric
        if(GAME_DATA.skills.includes('vampiric')){
            GAME_DATA.playerHp=Math.min(GAME_DATA.playerMaxHp,GAME_DATA.playerHp+5);
        }
        // Particles
        for(let i=0;i<8;i++){
            const p = this.add.circle(enemy.x,enemy.y,Phaser.Math.Between(3,6),
                type==='boss'?0xff6600:0x00ccff).setDepth(30);
            const a=Math.random()*Math.PI*2,s=Phaser.Math.Between(80,200);
            this.tweens.add({targets:p,x:p.x+Math.cos(a)*s*0.3,y:p.y+Math.sin(a)*s*0.3,
                alpha:0,scale:0,duration:400,onComplete:()=>p.destroy()});
        }
        if(type==='boss'){this.bossActive=false;this.bossBar.setVisible(false);this.bossText.setVisible(false);
            this.cameras.main.shake(300,0.02);}
        enemy.destroy();
    }

    enemyHitPlayer(player,enemy) {
        if(this.invulnTime>0||!enemy.active) return;
        GAME_DATA.playerHp -= enemy.getData('damage');
        this.invulnTime = 500;
        this.cameras.main.shake(100,0.01);
        if(GAME_DATA.playerHp<=0) this.scene.start('GameOver',{victory:false});
    }

    eBulletHitPlayer(player,bullet) {
        if(this.invulnTime>0||!bullet.active) return;
        GAME_DATA.playerHp -= bullet.getData('damage');
        this.invulnTime = 300;
        bullet.setActive(false).setVisible(false);bullet.body.enable=false;
        this.cameras.main.shake(80,0.008);
        if(GAME_DATA.playerHp<=0) this.scene.start('GameOver',{victory:false});
    }

    collectXp(player,orb) {
        if(!orb.active) return;
        GAME_DATA.xp += orb.getData('value')||10;
        orb.setActive(false).setVisible(false);orb.body.enable=false;
        if(GAME_DATA.xp >= 100*GAME_DATA.level){
            GAME_DATA.xp=0; GAME_DATA.level++;
            this.scene.pause();
            this.scene.launch('Upgrade');
        }
    }

    showWaveBanner() {
        const t = this.add.text(400,280,'WAVE '+GAME_DATA.wave+' COMPLETE!',{
            fontSize:'28px',fontFamily:'monospace',color:'#ffcc00',stroke:'#000',strokeThickness:4
        }).setOrigin(0.5).setDepth(100);
        this.tweens.add({targets:t,alpha:0,y:260,duration:1500,onComplete:()=>t.destroy()});
    }

    nextWave() {
        GAME_DATA.wave++;
        this.waveEnemiesSpawned=0;
        this.waveEnemiesNeeded=5+GAME_DATA.wave*3;
        this.waveComplete=false;
        this.waveText.setText('Wave '+GAME_DATA.wave);
        if(GAME_DATA.wave%5===0) this.spawnBoss();
    }

    updateHUD() {
        // HP bar
        this.hpBar.clear();
        this.hpBar.fillStyle(0x331111);this.hpBar.fillRect(10,10,180,14);
        const pct=GAME_DATA.playerHp/GAME_DATA.playerMaxHp;
        const col=pct>0.5?0x44ff44:pct>0.25?0xffaa00:0xff3333;
        this.hpBar.fillStyle(col);this.hpBar.fillRect(10,10,180*pct,14);
        this.hpBar.lineStyle(1,0xffffff,0.3);this.hpBar.strokeRect(10,10,180,14);
        // XP bar
        this.xpBar.clear();
        this.xpBar.fillStyle(0x111133);this.xpBar.fillRect(10,28,180,8);
        this.xpBar.fillStyle(0xaa66ff);
        this.xpBar.fillRect(10,28,180*(GAME_DATA.xp/(100*GAME_DATA.level)),8);
        this.levelText.setText('LVL '+GAME_DATA.level);
        this.scoreText.setText(GAME_DATA.score);
        // Boss bar
        if(this.bossActive){
            const boss=this.enemies.getChildren().find(e=>e.active&&e.getData('type')==='boss');
            if(boss){
                this.bossBar.clear();
                this.bossBar.fillStyle(0x330000);this.bossBar.fillRect(200,555,400,16);
                this.bossBar.fillStyle(0xff2200);
                this.bossBar.fillRect(200,555,400*(boss.getData('hp')/boss.getData('maxHp')),16);
                this.bossText.setText('INFERNO LORD');
            }
        }
        // Enemy AI - move towards player
        this.enemies.getChildren().forEach(e=>{
            if(!e.active)return;
            this.physics.moveToObject(e,this.player,e.getData('speed'));
        });
    }
}

// ===== UPGRADE SCENE =====
class UpgradeScene extends Phaser.Scene {
    constructor(){super('Upgrade');}
    create(){
        const bg = this.add.rectangle(400,300,800,600,0x000000,0.85).setDepth(0);
        this.add.text(400,80,'LEVEL UP!',{fontSize:'32px',fontFamily:'monospace',color:'#ffcc00',
            stroke:'#000',strokeThickness:4}).setOrigin(0.5);
        this.add.text(400,120,'Choose an upgrade',{fontSize:'14px',fontFamily:'monospace',color:'#aaa'}).setOrigin(0.5);

        const UPGRADES=[
            {name:'Rapid Fire',desc:'Fire rate +30%',icon:'\u{1F525}',apply:()=>{GAME_DATA.fireRate*=0.7;}},
            {name:'Power Shot',desc:'Damage +10',icon:'\u{2694}\uFE0F',apply:()=>{GAME_DATA.playerDamage+=10;}},
            {name:'Swift Feet',desc:'Speed +20%',icon:'\u{1F4A8}',apply:()=>{GAME_DATA.playerSpeed*=1.2;}},
            {name:'Iron Skin',desc:'Max HP +30',icon:'\u{1F6E1}\uFE0F',apply:()=>{GAME_DATA.playerMaxHp+=30;GAME_DATA.playerHp+=30;}},
            {name:'Vampiric',desc:'Heal 5 HP/kill',icon:'\u{1F9DB}',apply:()=>{GAME_DATA.skills.push('vampiric');}},
            {name:'Piercing',desc:'Bullets pierce',icon:'\u{1F3AF}',apply:()=>{GAME_DATA.skills.push('piercing');}},
            {name:'Multishot',desc:'Fire 3 bullets',icon:'\u2726',apply:()=>{GAME_DATA.skills.push('multishot');}},
            {name:'Explosion',desc:'AoE on hit',icon:'\u{1F4A5}',apply:()=>{GAME_DATA.skills.push('explosion');}},
            {name:'Magnet',desc:'XP range +',icon:'\u{1F9F2}',apply:()=>{GAME_DATA.skills.push('magnet');}},
            {name:'Regen',desc:'Regen HP/s',icon:'\u{1F49A}',apply:()=>{GAME_DATA.skills.push('regen');}},
            {name:'Critical',desc:'25% x2 dmg',icon:'\u{1F3B2}',apply:()=>{GAME_DATA.skills.push('crit');}}
        ];

        const pool=[...UPGRADES];
        const choices=[];
        for(let i=0;i<3&&pool.length>0;i++){
            const idx=Phaser.Math.Between(0,pool.length-1);
            choices.push(pool.splice(idx,1)[0]);
        }

        choices.forEach((u,i)=>{
            const cx=400-220+i*220, cy=300;
            const card=this.add.rectangle(cx,cy,180,200,0x1a1a3a).setStrokeStyle(2,0xffcc00).setInteractive();
            this.add.text(cx,cy-60,u.icon,{fontSize:'36px'}).setOrigin(0.5);
            this.add.text(cx,cy,u.name,{fontSize:'14px',fontFamily:'monospace',color:'#fff'}).setOrigin(0.5);
            this.add.text(cx,cy+30,u.desc,{fontSize:'11px',fontFamily:'monospace',color:'#aaa'}).setOrigin(0.5);
            this.add.text(cx,cy+70,'['+(i+1)+']',{fontSize:'18px',fontFamily:'monospace',color:'#ffcc00'}).setOrigin(0.5);
            card.on('pointerdown',()=>{u.apply();this.close();});
        });

        this.input.keyboard.on('keydown-ONE',()=>{if(choices[0]){choices[0].apply();this.close();}});
        this.input.keyboard.on('keydown-TWO',()=>{if(choices[1]){choices[1].apply();this.close();}});
        this.input.keyboard.on('keydown-THREE',()=>{if(choices[2]){choices[2].apply();this.close();}});
    }
    close(){this.scene.resume('Game');this.scene.stop();}
}

// ===== GAME OVER SCENE =====
class GameOverScene extends Phaser.Scene {
    constructor(){super('GameOver');}
    init(data){this.victory=data.victory||false;}
    create(){
        this.cameras.main.setBackgroundColor(this.victory?'#001a00':'#1a0000');
        const title=this.victory?'VICTORY!':'YOU DIED';
        const col=this.victory?'#44ff44':'#ff3333';
        this.add.text(400,200,title,{fontSize:'48px',fontFamily:'monospace',color:col,
            stroke:'#000',strokeThickness:5}).setOrigin(0.5);
        this.add.text(400,300,
            'Wave: '+GAME_DATA.wave+'  |  Score: '+GAME_DATA.score+'  |  Kills: '+GAME_DATA.kills,
            {fontSize:'16px',fontFamily:'monospace',color:'#ccc'}).setOrigin(0.5);
        this.add.text(400,340,'Level: '+GAME_DATA.level+'  |  Skills: '+GAME_DATA.skills.length,
            {fontSize:'14px',fontFamily:'monospace',color:'#aaa'}).setOrigin(0.5);

        const btn=this.add.text(400,440,'TAP TO RESTART',{fontSize:'20px',fontFamily:'monospace',
            color:'#ffcc00',stroke:'#000',strokeThickness:3}).setOrigin(0.5).setInteractive();
        this.tweens.add({targets:btn,alpha:0.4,yoyo:true,repeat:-1,duration:800});
        btn.on('pointerdown',()=>{resetGameData();this.scene.start('Game');});
        this.input.keyboard.on('keydown-R',()=>{resetGameData();this.scene.start('Game');});
    }
}
